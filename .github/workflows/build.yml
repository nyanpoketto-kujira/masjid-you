name: Build & Release (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build ${{ matrix.app }} (aarch64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [tv_display, mobile_remote]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Cache pub get
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build ${{ matrix.app }} APK (arm64-v8a)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64

      - name: Rename APK for unique artifact name
        run: |
          mv apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk \
             apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-arm64-v8a.apk

      - name: Upload ${{ matrix.app }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk-aarch64
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-arm64-v8a.apk
          retention-days: 14

  build-android-x64:
    name: Build ${{ matrix.app }} (x86_64)
    # APK x86_64 hanya untuk tes di emulator Intel (PR / manual), tidak ikut release.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [tv_display, mobile_remote]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Cache pub get
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build ${{ matrix.app }} APK (x86_64)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk \
            --release \
            --target-platform=android-x64

      - name: Rename APK for unique artifact name
        run: |
          mv apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk \
             apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-x86_64.apk

      - name: Upload ${{ matrix.app }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk-x86_64
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-x86_64.apk
          retention-days: 14

  create-release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk-aarch64'
          merge-multiple: true

      - name: Get version
        id: ver
        run: echo "VERSION=$(grep '^version:' apps/mobile_remote/pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: Masjid You v${{ steps.ver.outputs.VERSION }}
          body: |
            **Build aarch64 (ARM64)** — compiled on GitHub Actions

            - **Host (tv_display):** TV display controller
            - **Remote (mobile_remote):** Phone remote controller

            > Built on ${{ github.sha }} · ${{ github.repository }}
          files: |
            tv_display-arm64-v8a.apk
            mobile_remote-arm64-v8a.apk
          draft: false
          prerelease: false

  build-windows:
    name: Build tv_display (Windows x64)
    # Build desktop Windows hanya untuk PR / manual — release di main
    # tetap Android saja.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Cache pub get
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build tv_display Windows (release)
        working-directory: apps/tv_display
        run: flutter build windows --release

      # Zip harus portabel: aplikasi Flutter Windows butuh runtime
      # Visual C++ (msvcp140/vcruntime140) yang TIDAK selalu ada di PC
      # tujuan — terbukti di PC pameran nekios-school 2026-11-19 (gagal
      # jalan, 0xC0000135). Salin 3 DLL redist dari runner ke sebelah
      # .exe (Windows mencari DLL di folder aplikasi lebih dulu), jadi
      # zip jalan di PC mana pun tanpa memasang redistributable.
      # Gagal keras bila ada DLL yang tidak ditemukan supaya zip
      # non-portabel tidak pernah terkirim diam-diam.
      - name: Bundle VC++ runtime DLLs (zip portabel)
        working-directory: apps/tv_display
        shell: pwsh
        run: |
          $bundle = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = Join-Path $env:SystemRoot "System32\$dll"
            if (-not (Test-Path $src)) { throw "DLL tidak ditemukan di runner: $src" }
            Copy-Item $src (Join-Path $bundle $dll) -Force
          }
          Get-ChildItem $bundle -Filter *.dll | Select-Object Name, Length

      - name: Zip bundle
        working-directory: apps/tv_display
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath tv_display-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv_display-windows-x64
          path: apps/tv_display/tv_display-windows-x64.zip
          retention-days: 14
