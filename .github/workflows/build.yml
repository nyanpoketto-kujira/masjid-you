name: Build & Release (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build ${{ matrix.app }} (aarch64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [tv_display, mobile_remote]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Cache pub get
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Build ${{ matrix.app }} APK (arm64-v8a)
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter build apk \
            --release \
            --target-platform=android-arm64

      - name: Rename APK for unique artifact name
        run: |
          mv apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk \
             apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-arm64-v8a.apk

      - name: Upload ${{ matrix.app }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk-aarch64
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}-arm64-v8a.apk
          retention-days: 14

  create-release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-apk-aarch64'
          merge-multiple: true

      - name: Get version
        id: ver
        run: echo "VERSION=$(grep '^version:' apps/mobile_remote/pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.VERSION }}
          name: Masjid You v${{ steps.ver.outputs.VERSION }}
          body: |
            **Build aarch64 (ARM64)** — compiled on GitHub Actions

            - **Host (tv_display):** TV display controller
            - **Remote (mobile_remote):** Phone remote controller

            > Built on ${{ github.sha }} · ${{ github.repository }}
          files: |
            tv_display-arm64-v8a.apk
            mobile_remote-arm64-v8a.apk
          draft: false
          prerelease: false
